name: inception

services:
  nginx:
    image: nginx:v1
    container_name: nginx
    build: ./requirements/nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "4000:4000"
    volumes:
      - wordpress_data:/var/www/html
      - ./requirements/nginx/static:/var/www/static:ro
    env_file:
      - .env
    depends_on:
      - wordpress
    networks:
      - docker-network

  wordpress:
    image: wordpress:v1
    container_name: wordpress
    build: ./requirements/wordpress
    restart: unless-stopped
    expose:
      - "9000"
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_subs_password
    depends_on:
      - mariadb
    networks:
      - docker-network

  mariadb:
    image: mariadb:v1
    container_name: mariadb
    build: ./requirements/mariadb
    restart: unless-stopped
    expose:
      - "3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    networks:
      - docker-network

  adminer:
    image: adminer:v1
    container_name: adminer
    build: ./requirements/adminer
    restart: unless-stopped
    environment:
      - ADMINER_DESIGN=galkaev
    env_file:
      - .env
    networks:
      - docker-network

  redis:
    image: redis:v1
    container_name: redis
    build: ./requirements/redis
    restart: unless-stopped
    networks:
      - docker-network

  uptime-kuma:
    image: uptime_kuma:v1
    container_name: uptime_kuma
    build: ./requirements/uptime_kuma
    restart: unless-stopped
    volumes:
      - kuma_data:/app/data
    secrets:
      - kuma_password
    networks:
      - docker-network


volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress

  kuma_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/kuma


networks:
  docker-network:
    driver: bridge


secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_subs_password:
    file: ../secrets/wp_subs_password.txt
  kuma_password:
    file: ../secrets/kuma_password.txt
